name: tests

on:
  push:
    branches: [master, main, test]
  pull_request:
  workflow_dispatch:

jobs:
  # The bulk of the suite is deliberately dolfinx-free: the properties that were
  # actually wrong in this codebase -- a convergence test that could never fire,
  # a gradient reduction, a biased statistic, a config that did not describe its
  # run -- are all checkable in closed form on small arrays. That keeps CI fast
  # and means a regression is caught in seconds rather than in a six-day run.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pyyaml pytest
      - name: Run tests that need no FEA stack
        run: pytest -q -m "not dolfinx and not mpi"

  # Tests that need PETSc/dolfinx run in the project's own image, so CI uses the
  # same stack the results are produced with.
  solver:
    runs-on: ubuntu-latest
    container:
      image: dolfinx/dolfinx:stable
    steps:
      - uses: actions/checkout@v4
      - name: Install test-only dependencies
        run: pip install pytest openturns
      - name: Run solver-dependent tests
        run: pytest -q -m "dolfinx and not mpi"
      - name: MPI consistency (2 ranks)
        run: mpirun -n 2 --allow-run-as-root python -m pytest -q -m mpi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Config already in pyproject.toml. Non-blocking for now: the vendored
      # FEniTop sources under src/fenitop/ are not ours to restyle.
      - run: ruff check src tests --exclude src/fenitop || true
