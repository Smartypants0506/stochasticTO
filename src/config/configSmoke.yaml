# =============================================================================
# SMOKE TEST — exercises all six stages end to end in minutes, not days.
#
#   mpirun -n 8 python src/mainClean.py src/config/configSmoke.yaml
#
# Not a scientific configuration. Every fidelity knob is set as low as the code
# allows, so the numbers it produces are meaningless. What it checks is that the
# PIPELINE is sound:
#
#   * the four verification gates run and pass
#   * the boundary-offset measurement runs and reports
#   * the Pareto sweep produces a non-dominated set (or fails loudly)
#   * beta continuation runs its stages
#   * Stage 6 validates every design on a common ensemble with CIs
#   * a manifest is written with the effective parameters
#
# Target: under 10 minutes on 8 ranks. If it takes materially longer, something
# has regressed into doing production-scale work.
# =============================================================================

mesh_source: "box"

box_mesh:
  cell_type: "tetrahedron"
  # -> [10, 30, 10], h = 1.0. R/h = 0.6, i.e. the filter is SMALLER than one
  # element. That is deliberate for a smoke test (it keeps the KL eigensolve at
  # ~3.8k nodes instead of ~17k) but it means the eta model is NOT physically
  # meaningful here: with a sub-element filter there is no resolved interface
  # band, so the boundary-offset gate will correctly report the perturbation as
  # unresolvable. THAT WARNING IS EXPECTED IN THIS CONFIG ONLY. It must never be
  # ignored on configStudy.yaml or config.yaml, where R/h is 0.96 and 1.5.
  #
  # An earlier version used refinement 0.24 (h = 1.67, R/h = 0.36) with
  # saa_beta_max = 128. That combination is not merely coarse, it is DEGENERATE:
  # see the beta note below.
  refinement: 0.4

optimization:
  max_iter: 20               # split across the beta stages
  epsilon: 1.0e-4

  robust_method: "saa"
  saa_n_samples: 16
  saa_sampling_strategy: "monte_carlo"
  saa_seed: 7

  # Stages 8 -> 16 -> 32. Continuation is exercised; beta_max is deliberately
  # NOT 128 here.
  #
  # WHY beta_max IS CAPPED ON THIS MESH. The projection tanh(beta*(rho_tilde -
  # eta)) saturates to +/-1 in double precision once |rho_tilde - eta| exceeds
  # about 19/beta. At beta=128 that is 0.15, so only nodes with rho_tilde in
  # roughly [0.10, 0.90] respond to eta at all. On a mesh this coarse the
  # filtered field jumps between 0 and 1 inside a single element, so almost no
  # node lands there -- every eta draw then yields the SAME compliance, sigma_C
  # is exactly zero, and dsigma_C/drho divides by zero. That is precisely how
  # this config crashed with beta_max=128 at refinement 0.24.
  #
  # At beta=32 the responsive band is +/-0.59 around the eta band, which covers
  # the whole [0,1] range, so the smoke run is non-degenerate by construction.
  # The production and study configs keep beta_max=128 because their meshes
  # resolve the filter (R/h = 1.5 and 0.96) and therefore have a real interface
  # band for eta to act on.
  saa_beta: 8.0
  saa_beta_max: 32.0
  saa_beta_continuation: true

  robust_opt_tol: 1.0e-3
  constraint_tol: 1.0e-2     # loose: 20 iterations will not converge properly

  lambda_sweep: [0.0, 2.0]
  lambda_sweep_start: "common"
  # A 20-iteration solve is nowhere near converged, so its two points may well
  # dominate each other. That is expected here and is NOT a pipeline failure --
  # this is the one configuration where the check is turned off deliberately.
  sweep_check_dominance: false

  sample_parallel_ranks_per_group: 4

random_field:
  sigma: 1.0
  # Correlation length is in domain units and the domain is unchanged, so this
  # stays 4.0 -- the coarse mesh resolves fewer modes, which is fine here.
  length_scale: 4.0
  spatial_dim: 3
  variance_threshold: 0.90   # fewer KL modes -> faster eigensolve
  n_kl_hint: 10
  seed: 42
  eta_min: 0.25
  eta_max: 0.75
  alpha: 2.0
  beta: 2.0

surrogate:
  n_train: 20
  n_test: 10
  hyperbolic_q: 0.75
  max_degree_attempts: 2
  q2_threshold: 0.50

mc_validation:
  n_samples: 32
  beta: 32.0                 # must equal optimization.saa_beta_max (loader enforces)
  seed: 42
  percentile_low: 5.0
  percentile_high: 95.0
  output_dir: "output/mc_validation_smoke"
  n_bootstrap: 500
  confidence: 0.95
  bootstrap_seed: 0
  write_ensemble: false
  # Tolerated on this mesh only. R/h = 0.6 plus vol_frac = 0.08 makes the
  # eroded realizations genuinely near-disconnected, so a few percent of solves
  # legitimately fail -- a smoke test must not halt on that. The rate is still
  # reported, and the compliance statistics are flagged as conditional.
  # Production and study tiers keep this much tighter.
  max_solver_failure_rate: 0.20

validation:
  # Gates stay ON. They are the point of the smoke test: a pipeline change that
  # breaks the adjoint or the eta marginal must fail here, in minutes, rather
  # than in a six-day production run.
  run_gates: true
  gradient_fd: true
  fd_n_samples: 4
  fd_n_elements: 6
  fd_step: 1.0e-3
  fd_rtol: 1.0e-2            # loose: tiny mesh, few samples
  fd_ksp_rtol: 1.0e-12
  correlation_n_nodes: 32
  correlation_n_samples: 1000
  correlation_rtol: 0.10
  marginal_n_nodes: 32
  marginal_n_samples: 500
  marginal_alpha: 0.01
