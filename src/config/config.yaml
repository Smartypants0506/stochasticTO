# mesh_source: "step" (CAD pipeline, default) or "box" (synthetic mesh
# ported from FEniTop's scripts/beam_3d.py, for validating topopt()
# against that reference case -- see src/meshing/box_source.py).
# step_file/mesh_out_path/snap_tol/color_targets/solid_volume_color/
# keep_alive below are ignored when mesh_source: "box".
mesh_source: "box"
 
box_mesh:
  # "tetrahedron" (default) required for the full Stage 2-6 pipeline
  # (Stage 3's KL expansion needs a simplicial mesh_serial). beam_3d.py
  # itself uses "hexahedron", but that's Stage-2-only -- main.py raises
  # if you set this to "hexahedron" and let the pipeline run past Stage 2.
  cell_type: "tetrahedron"

step_file: "data/cad/ge_bracket_rotated_nonds.step"
mesh_out_path: "output/meshes/ge_bracket_rotated_nonds.xdmf"
mesh_size_max: 2.0e-3
snap_tol: 1.0e-4

material:
  youngs_modulus: 68900000000
  poissons_ratio: 0.33

petsc:
  ksp_type: "cg"
  pc_type: "gamg"

load_cases:
  upward:
    - group_name: "load_1"
      vector: [0.0, 0.0, 500000.0]
    - group_name: "load_2"
      vector: [0.0, 0.0, 500000.0]
  downward:
    - group_name: "load_1"
      vector: [0.0, 0.0, -500000.0]
    - group_name: "load_2"
      vector: [0.0, 0.0, -500000.0]
  leftward:
    - group_name: "load_1"
      vector: [-500000.0, 0.0, 0.0]
    - group_name: "load_2"
      vector: [-500000.0, 0.0, 0.0]
  rightward:
    - group_name: "load_1"
      vector: [500000.0, 0.0, 0.0]
    - group_name: "load_2"
      vector: [500000.0, 0.0, 0.0]
  forward:
    - group_name: "load_1"
      vector: [0.0, 500000.0, 0.0]
    - group_name: "load_2"
      vector: [0.0, 500000.0, 0.0]
  backward:
    - group_name: "load_1"
      vector: [0.0, -500000.0, 0.0]
    - group_name: "load_2"
      vector: [0.0, -500000.0, 0.0]

optimization:
  max_iter: 400
  opt_tol: 1.0e-3
  vol_frac: 0.08
  penalty: 3.0
  epsilon: 1.0e-6
  filter_radius: 0.006
  beta_interval: 50
  beta_max: 128
  use_oc: true
  move: 0.02
  opt_compliance: true
  quadrature_degree: 2
  body_force: [0.0, 0.0, 0.0]
  lambda_sweep: [0.0, 1.0, 2.0, 5.0]

color_targets:
  fixed: [255, 0, 0, 255]
  load_1: [0, 255, 0, 255]
  load_2: [0, 0, 255, 255]

solid_volume_color: [255, 255, 0, 255]

random_field:
  sigma: 0.2
  length_scale: 4
  spatial_dim: 3
  eta_min: 0.3
  eta_max: 0.7
  alpha: 2.0
  beta: 2.0
  variance_threshold: 0.75
  n_kl_hint: 20
  seed: 42

surrogate:
  n_train: 200
  n_test: 50
  hyperbolic_q: 0.75
  max_degree_attempts: 8
  q2_threshold: 0.99

mc_validation:
  n_samples: 100
  beta: 64
  seed: 42
  percentile_low: 5.0
  percentile_high: 95.0
  output_dir: "output/mc_validation"

keep_alive:
  enabled: false
  groups: ["fixed", "load_1", "load_2"]
  corridor_radius: 4.0e-3     # ~2x mesh_size_max; null -> auto
  cluster_eps: 4.0e-3         # null -> auto (~2x mesh_size_max)